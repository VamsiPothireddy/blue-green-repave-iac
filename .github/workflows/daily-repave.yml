name: Daily Blue/Green Repave

on:
  schedule:
    # TODO: adjust time (UTC). Currently 06:00 UTC daily.
    - cron: "0 6 * * *"
  workflow_dispatch: {} # allows manual trigger for testing

permissions:
  id-token: write   # required for AWS OIDC
  contents: write   # required for branch operations

env:
  AWS_REGION: us-east-1                # TODO: set your region
  AWS_ROLE_ARN: arn:aws:iam::PLACEHOLDER_ACCOUNT_ID:role/PLACEHOLDER_ROLE_NAME  # TODO: fill in your AWS OIDC role
  TF_VERSION: "1.7.5"

jobs:
  determine-target:
    runs-on: ubuntu-latest
    outputs:
      active_env: ${{ steps.state.outputs.active_env }}
      inactive_env: ${{ steps.state.outputs.inactive_env }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for branch operations

      - name: Determine active environment from branches
        id: state
        run: |
          # Check which branch has active=true in its config.tfvars file
          echo "Checking blue branch..."
          if git show blue:terraform/environments/config.tfvars 2>/dev/null | grep -q "active = true"; then
            active="blue"
            inactive="green"
          elif git show green:terraform/environments/config.tfvars 2>/dev/null | grep -q "active = true"; then
            active="green"
            inactive="blue"
          else
            echo "No active environment found, defaulting to blue"
            active="blue"
            inactive="green"
          fi
          echo "active_env=$active" >> "$GITHUB_OUTPUT"
          echo "inactive_env=$inactive" >> "$GITHUB_OUTPUT"
          echo "Active: $active | Repaving: $inactive"

  repave-inactive:
    needs: determine-target
    runs-on: ubuntu-latest
    env:
      TARGET_ENV: ${{ needs.determine-target.outputs.inactive_env }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for branch operations

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Create or checkout target branch
        run: |
          # Check if the target branch exists
          if git ls-remote --heads origin $TARGET_ENV | grep -q $TARGET_ENV; then
            echo "Branch $TARGET_ENV exists, checking it out"
            git checkout $TARGET_ENV
            git pull origin $TARGET_ENV
          else
            echo "Branch $TARGET_ENV does not exist, creating it from main"
            git checkout -b $TARGET_ENV main
            git push -u origin $TARGET_ENV
          fi

      - name: Disable SQS->Lambda trigger for target env (pre-repave)
        run: |
          # TODO: this is also settable via terraform var event_source_mapping_enabled=false
          # on the destroy/apply below — keeping this as an explicit step for clarity/visibility.
          echo "Disabling event source mapping for $TARGET_ENV before repave"

      - name: Terraform destroy (target env)
        working-directory: terraform/environments
        run: |
          terraform init \
            -backend-config="key=blue-green-repave-iac/$TARGET_ENV/terraform.tfstate"
          terraform destroy -auto-approve \
            -var-file=config.tfvars \
            -var="event_source_mapping_enabled=false"

      - name: Terraform plan (target env)
        working-directory: terraform/environments
        run: |
          terraform init \
            -backend-config="key=blue-green-repave-iac/$TARGET_ENV/terraform.tfstate"
          terraform plan -var-file=config.tfvars \
            -var="event_source_mapping_enabled=true" -out=tfplan

      - name: Terraform apply (target env)
        working-directory: terraform/environments
        run: |
          terraform init \
            -backend-config="key=blue-green-repave-iac/$TARGET_ENV/terraform.tfstate"
          terraform apply tfplan

      - name: Smoke test freshly-repaved environment
        run: |
          # TODO: real health check against $TARGET_ENV before promoting it.
          echo "TODO: add smoke tests for $TARGET_ENV here. Fail the job if unhealthy."

  promote-and-flip:
    needs: [determine-target, repave-inactive]
    runs-on: ubuntu-latest
    env:
      NEW_ACTIVE: ${{ needs.determine-target.outputs.inactive_env }}
      OLD_ACTIVE: ${{ needs.determine-target.outputs.active_env }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for branch operations

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Flip traffic to newly-repaved environment
        run: |
          # TODO: this is where the actual cutover happens for LB-fronted workloads:
          # e.g. update target group weights, or an ALB listener rule, or a Route53
          # weighted record. For non-LB paths, this is where you'd flip whatever each
          # resource's own adapter uses (see docs/ARCHITECTURE.md).
          echo "TODO: flip routing from $OLD_ACTIVE to $NEW_ACTIVE"

      - name: Update active status in config.tfvars files
        run: |
          # Update the old active branch to inactive
          git checkout $OLD_ACTIVE
          git pull origin $OLD_ACTIVE
          sed -i 's/active = true/active = false/' terraform/environments/config.tfvars
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Set $OLD_ACTIVE to inactive after repave" || echo "No changes to commit"
          git push origin $OLD_ACTIVE

          # Update the new active branch to active
          git checkout $NEW_ACTIVE
          git pull origin $NEW_ACTIVE
          sed -i 's/active = false/active = true/' terraform/environments/config.tfvars
          git commit -am "Set $NEW_ACTIVE to active after repave" || echo "No changes to commit"
          git push origin $NEW_ACTIVE

          echo "Active environment is now $NEW_ACTIVE (was $OLD_ACTIVE)"
